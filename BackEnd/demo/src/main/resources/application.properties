spring.application.name=demo

# Loads secrets from a local .env file (not committed); real env vars also work.
# file: paths resolve against the JVM working directory, so .env is looked up from
# demo/, BackEnd/ and UberClone/ working directories.
spring.config.import=optional:file:.env[.properties],optional:file:demo/.env[.properties],optional:file:BackEnd/demo/.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security (HTTP Basic, in-memory users)
app.security.user.username=${APP_USER_USERNAME}
app.security.user.password=${APP_USER_PASSWORD}
app.security.admin.username=${APP_ADMIN_USERNAME}
app.security.admin.password=${APP_ADMIN_PASSWORD}
